# yaml-language-server: $schema=https://schema.opencollection.com/opencollection/v1.0.0.json#/$defs/HttpRequest
info:
  type: http
  name: Get subtopic
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/subtopics/get/{{subtopic-1}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.name
      operator: eq
      value: "subtopic-1"
