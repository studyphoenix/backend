# yaml-language-server: $schema=https://schema.opencollection.com/opencollection/v1.0.0.json#/$defs/HttpRequest
info:
  type: http
  name: Get flashcard
  seq: 4

http:
  method: GET
  url: "{{baseUrl}}/flashcards/get/{{flashcard-1}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.name
      operator: eq
      value: "flashcard-1"
