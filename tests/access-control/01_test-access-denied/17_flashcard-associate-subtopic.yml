# yaml-language-server: $schema=https://schema.opencollection.com/opencollection/v1.0.0.json#/$defs/HttpRequest
info:
  type: http
  name: Associate flashcard to the subject
  seq: 18

http:
  method: PATCH
  url: "{{baseUrl}}/subtopics/associate/flashcards/{{subtopic-1}}"
  body:
    type: json
    data: |
      [{{flashcard-1}}]

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "204"
