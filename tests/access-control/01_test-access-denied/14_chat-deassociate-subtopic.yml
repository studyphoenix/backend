# yaml-language-server: $schema=https://schema.opencollection.com/opencollection/v1.0.0.json#/$defs/HttpRequest
info:
  type: http
  name: Deassociate chat from the subtopic
  seq: 7

http:
  method: PATCH
  url: "{{baseUrl}}/subtopic/deassociate/chats/{{subtopic-1}}"
  body:
    type: json
    data: |
      [{{chat-1}}]

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "404"
