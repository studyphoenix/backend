# yaml-language-server: $schema=https://schema.opencollection.com/opencollection/v1.0.0.json#/$defs/HttpRequest
info:
  type: http
  name: Switch User ID
  seq: 7

http:
  method: GET
  url: "{{baseUrl}}/testing/uid?userid=1000"

settings:
  followRedirects: true

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.userid
      operator: eq
      value: "1000"
