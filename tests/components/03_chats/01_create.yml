# yaml-language-server: $schema=https://schema.opencollection.com/opencollection/v1.0.0.json#/$defs/HttpRequest
info:
  type: http
  name: Create chat
  seq: 1

http:
  method: PUT
  url: "{{baseUrl}}/chats/create"
  body:
    type: json
    data: |
      {
        "mode": 1,
        "name": "test"
      }

runtime:
  scripts:
    - type: after-response
      code: |-
        bru.setVar("chats-1", res.body.id)
  assertions:
    - expression: res.status
      operator: eq
      value: "201"
