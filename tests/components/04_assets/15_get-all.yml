# yaml-language-server: $schema=https://schema.opencollection.com/opencollection/v1.0.0.json#/$defs/HttpRequest
info:
  type: http
  name: Check that all assets are returned
  seq: 15

http:
  method: GET
  url: "{{baseUrl}}/assets/search"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.length
      operator: eq
      value: "3"
    - expression: res.body[0].name
      operator: eq
      value: "test 2"
    - expression: res.body[1].name
      operator: eq
      value: "test 3"
    - expression: res.body[2].name
      operator: eq
      value: "test 4"
