# yaml-language-server: $schema=https://schema.opencollection.com/opencollection/v1.0.0.json#/$defs/HttpRequest
info:
  type: http
  name: Create another subtopic
  seq: 11

http:
  method: PUT
  url: "{{baseUrl}}/subtopics/create"
  body:
    type: json
    data: |
      {
        "icon": "fa-gear",
        "name": "another",
        "subject": {{subtopics-subject-id}}
      }

runtime:
  scripts:
    - type: after-response
      code: |-
        bru.setVar("subtopics-subtopic-2", res.body.id)
  assertions:
    - expression: res.status
      operator: eq
      value: "201"
