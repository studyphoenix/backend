# yaml-language-server: $schema=https://schema.opencollection.com/opencollection/v1.0.0.json#/$defs/HttpRequest
info:
  type: http
  name: Check the created subtopic is correct
  seq: 7

http:
  method: GET
  url: "{{baseUrl}}/subtopics/get/{{subtopics-subtopic-1}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.icon
      operator: eq
      value: "fa-gear"
    - expression: res.body.name
      operator: eq
      value: "test"
