# yaml-language-server: $schema=https://schema.opencollection.com/opencollection/v1.0.0.json#/$defs/HttpRequest
info:
  type: http
  name: Check the created subject is correct
  seq: 11

http:
  method: GET
  url: "{{baseUrl}}/subjects/get/{{subtopics-subtopic-2}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.icon
      operator: eq
      value: "fa-gear"
    - expression: res.body.name
      operator: eq
      value: "another"
