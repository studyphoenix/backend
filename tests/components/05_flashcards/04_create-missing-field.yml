# yaml-language-server: $schema=https://schema.opencollection.com/opencollection/v1.0.0.json#/$defs/HttpRequest
info:
  type: http
  name: Create a flashcard (missing field)
  seq: 4

http:
  method: PUT
  url: "{{baseUrl}}/flashcards/create"
  body:
    type: json
    data: |
      {
        "name": "test",
        "content": "my content"
      }

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "201"
