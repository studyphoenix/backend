# yaml-language-server: $schema=https://schema.opencollection.com/opencollection/v1.0.0.json#/$defs/HttpRequest
info:
  type: http
  name: Check the created flashcard is correct
  seq: 5

http:
  method: GET
  url: "{{baseUrl}}/flashcards/get/0"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.icon
      operator: eq
      value: "fa-gear"
    - expression: res.body.name
      operator: eq
      value: "test"
    - expression: res.body.content
      operator: eq
      value: "my content"
