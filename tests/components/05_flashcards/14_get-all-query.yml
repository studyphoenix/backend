# yaml-language-server: $schema=https://schema.opencollection.com/opencollection/v1.0.0.json#/$defs/HttpRequest
info:
  type: http
  name: Get all flashcards with test in name
  seq: 14

http:
  method: GET
  url: "{{baseUrl}}/flashcards/search?q=test"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.length
      operator: eq
      value: "2"
