# yaml-language-server: $schema=https://schema.opencollection.com/opencollection/v1.0.0.json#/$defs/HttpRequest
info:
  type: http
  name: Associate both subtopics to subject 1
  seq: 3

http:
  method: PATCH
  url: "{{baseUrl}}/subtopics/associate/subtopics/1"
  body:
    type: json
    data: |
      [4, 5]

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "204"
