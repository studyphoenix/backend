# yaml-language-server: $schema=https://schema.opencollection.com/opencollection/v1.0.0.json#/$defs/HttpRequest
info:
  type: http
  name: Associate both subtopics to subject 1
  seq: 3

http:
  method: PATCH
  url: "{{baseUrl}}/subtopics/associate/subtopics/{{subtopic-2}}"
  body:
    type: json
    data: |
      [{{techtree-st-1}}, {{techtree-st-2}}]

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "204"
