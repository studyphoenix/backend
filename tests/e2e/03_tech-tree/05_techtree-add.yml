            "name": "tt-st-bulk-1",
            "icon": "test",
            "tempId": 1
          },
          {
            "name": "tt-st-bulk-2",
            "icon": "test",
            "tempId": 2
          },
          {
            "name": "tt-st-bulk-3",
            "icon": "test",
            "tempId": 3
          },
          {
            "name": "tt-st-bulk-4",
            "icon": "test",
            "tempId": 4
          },
          {
            "name": "tt-st-bulk-5",
            "icon": "test",
            "tempId": 5
          }
        ],
        "edges": [
          {
            "from": 1,
            "to": 2
          },
          {
            "from": 1,
            "to": 3
          },
          {
            "from": 2,
            "to": 4
          },
          {
            "from": 3,
            "to": 5
          },
          {
