# yaml-language-server: $schema=https://schema.opencollection.com/opencollection/v1.0.0.json#/$defs/HttpRequest
info:
  type: http
  name: Create a second subtopic
  seq: 2

http:
  method: PUT
  url: "{{baseUrl}}/subtopics/create"
  body:
    type: json
    data: |
      {
        "icon": "fa-gear",
        "name": "tt-st-2",
        "subject": {{subject-2}}
      }

runtime:
  scripts:
    - type: after-response
      code: |-
        bru.setVar("techtree-st-2", res.body.id)
  assertions:
    - expression: res.status
      operator: eq
      value: "201"
