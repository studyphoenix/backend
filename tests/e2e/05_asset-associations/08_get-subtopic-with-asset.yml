# yaml-language-server: $schema=https://schema.opencollection.com/opencollection/v1.0.0.json#/$defs/HttpRequest
info:
  type: http
  name: Get subtopic with associated asset
  seq: 9

http:
  method: GET
  url: "{{baseUrl}}/subtopics/get/{{assoc-subtopic-1}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.assets.length
      operator: eq
      value: "1"
    - expression: res.body.assets[0].name
      operator: eq
      value: "assoc test asset"
