# yaml-language-server: $schema=https://schema.opencollection.com/opencollection/v1.0.0.json#/$defs/HttpRequest
info:
  type: http
  name: Create an asset for associations
  seq: 3

http:
  method: PUT
  url: "{{baseUrl}}/assets/create"
  body:
    type: json
    data: |
      {
        "icon": "mdi-file-document-multiple",
        "name": "assoc test asset",
        "mediaType": "application/pdf"
      }

runtime:
  scripts:
    - type: after-response
      code: |-
        bru.setVar("assoc-asset-1", res.body.id)
  assertions:
    - expression: res.status
      operator: eq
      value: "201"
