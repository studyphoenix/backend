# yaml-language-server: $schema=https://schema.opencollection.com/opencollection/v1.0.0.json#/$defs/HttpRequest
info:
  type: http
  name: Associate asset to subtopic
  seq: 8

http:
  method: PATCH
  url: "{{baseUrl}}/subtopics/associate/assets/{{assoc-subtopic-1}}"
  body:
    type: json
    data: |
      [{{assoc-asset-1}}]

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "204"
