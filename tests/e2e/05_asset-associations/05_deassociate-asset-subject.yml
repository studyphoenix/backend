# yaml-language-server: $schema=https://schema.opencollection.com/opencollection/v1.0.0.json#/$defs/HttpRequest
info:
  type: http
  name: Deassociate asset from subject
  seq: 6

http:
  method: PATCH
  url: "{{baseUrl}}/subjects/deassociate/assets/{{assoc-subject-1}}"
  body:
    type: json
    data: |
      [{{assoc-asset-1}}]

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "204"
