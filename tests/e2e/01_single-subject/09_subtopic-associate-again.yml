# yaml-language-server: $schema=https://schema.opencollection.com/opencollection/v1.0.0.json#/$defs/HttpRequest
info:
  type: http
  name: Associate both subtopics to the subject (again)
  seq: 9

http:
  method: PATCH
  url: "{{baseUrl}}/subjects/associate/subtopics/0"
  body:
    type: json
    data: |
      [0, 1]

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "204"
