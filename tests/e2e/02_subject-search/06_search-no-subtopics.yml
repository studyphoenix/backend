info:
  type: http
  name: Retrieve subjects without subtopics
  seq: 7

http:
  method: GET
  url: "{{baseUrl}}/subjects/search?maxSubtopicCount=0"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.length
      operator: eq
      value: "1"
