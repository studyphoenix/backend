# yaml-language-server: $schema=https://schema.opencollection.com/opencollection/v1.0.0.json#/$defs/HttpRequest
info:
  type: http
  name: Retrieve flashcards completed at least once
  seq: 9

http:
  method: GET
  url: "{{baseUrl}}/flashcards/search?minCompletionCount=1"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.length
      operator: eq
      value: "1"
