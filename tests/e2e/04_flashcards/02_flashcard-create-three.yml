# yaml-language-server: $schema=https://schema.opencollection.com/opencollection/v1.0.0.json#/$defs/HttpRequest
info:
  type: http
  name: Create a third flashcard
  seq: 3

http:
  method: PUT
  url: "{{baseUrl}}/flashcards/create"
  body:
    type: json
    data: |
      {
        "icon": "fa-gear",
        "name": "test 3",
        "content": "my content"
      }

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "201"
