# yaml-language-server: $schema=https://schema.opencollection.com/opencollection/v1.0.0.json#/$defs/HttpRequest
info:
  type: http
  name: Associate all flashcards to subtopic
  seq: 5

http:
  method: PATCH
  url: "{{baseUrl}}/subtopics/associate/flashcards/{{subtopic-3}}"
  body:
    type: json
    data: |
      [{{flashcard-1}}, {{flashcard-2}}, {{flashcard-3}}, {{flashcard-4}}]

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "204"
